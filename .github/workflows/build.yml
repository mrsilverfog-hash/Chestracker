name: Build Mod
on: [push, pull_request]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build with Gradle
        run: gradle build

      - name: Publier le .jar en téléchargement direct (Release "latest")
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Jar publié : $JAR"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "Dernière version" --notes "Compilé automatiquement depuis le commit ${GITHUB_SHA::7}." --latest
